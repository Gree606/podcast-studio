      <path d="M58 66h4" stroke="#1d1d2b" stroke-width="2.4"/>
      <g class="eyes"><circle cx="52" cy="66" r="2.3" fill="#1d1d2b"/><circle cx="68" cy="66" r="2.3" fill="#1d1d2b"/></g>

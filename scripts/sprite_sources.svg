      <path d="M22 44c-8 2-14 8-16 14M58 44c8-6 12-14 12-22" stroke="#e8edf7" stroke-width="8" stroke-linecap="round" fill="none"/>
      <rect x="22" y="36" width="36" height="34" rx="12" fill="#e8edf7"/><path d="M30 68l-4 18M50 68l4 18" stroke="#e8edf7" stroke-width="9" stroke-linecap="round"/>
      <circle cx="40" cy="24" r="18" fill="#f4f6fb"/><ellipse cx="42" cy="24" rx="12" ry="10" fill="#1a2550"/><path d="M36 19a8 6 0 0 1 8-3" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>
      <rect x="34" y="46" width="12" height="7" rx="2" fill="#ff6b6b"/></g></svg>
    <svg class="fl rock r1" viewBox="0 0 60 50"><title>Asteroid</title><path d="M8 18L22 4l20 2 14 14-4 18-18 10L6 38z" fill="#6b6f8a"/><circle cx="24" cy="20" r="5" fill="#575b75"/><circle cx="40" cy="30" r="3.5" fill="#575b75"/></svg>
    <svg class="fl rock r2" viewBox="0 0 60 50"><title>Asteroid</title><path d="M4 22L18 6h22l16 16-6 18-24 6L6 36z" fill="#7a6a8a"/><circle cx="30" cy="22" r="6" fill="#66587a"/></svg>
    <svg class="fl rock r3" viewBox="0 0 60 50"><title>Asteroid</title><path d="M10 14L30 4l22 10 2 22-20 12L8 40z" fill="#5f6b80"/><circle cx="22" cy="24" r="4" fill="#4e596c"/><circle cx="38" cy="18" r="3" fill="#4e596c"/></svg>

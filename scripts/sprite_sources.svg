      <path d="M60 16v88M16 60h88" stroke="#7d88aa" stroke-width="4"/><circle cx="60" cy="60" r="12" fill="#e8edf7"/><circle cx="60" cy="60" r="5" fill="#8b7bff"/>
      <circle class="lamp" cx="60" cy="16" r="4" fill="#ffd166"/><circle class="lamp l2" cx="104" cy="60" r="4" fill="#5ee6d0"/></g></svg>
    <svg class="fl astro" viewBox="0 0 80 90"><title>Floating astronaut</title>

    <circle class="blink" cx="100" cy="113" r="5" fill="#4cc9f0"/><circle class="blink b2" cx="138" cy="110" r="5" fill="#ffd166"/>
    <circle class="blink" cx="172" cy="102" r="5" fill="#ff6b9d"/>
  </symbol>
<symbol id="ship-rocket" viewBox="0 0 200 150">

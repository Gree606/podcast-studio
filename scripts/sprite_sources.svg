      <circle class="lamp" cx="18" cy="44" r="3" fill="#ffd166"/><circle class="lamp l2" cx="50" cy="49" r="3" fill="#5ee6d0"/><circle class="lamp" cx="82" cy="44" r="3" fill="#ffd166"/></svg>
    <svg class="fl rocket-s" viewBox="0 0 140 40"><title>Little rocket</title>
      <path d="M0 20h60" stroke="url(#trail)" stroke-width="4" stroke-linecap="round"/>
      <path class="fire" d="M58 12l-16 8 16 8z" fill="#ffd166"/>
      <path d="M58 8h50c14 0 26 6 32 12-6 6-18 12-32 12H58z" fill="#e8edf7"/><path d="M62 8l-8-8h18l8 8zM62 32l-8 8h18l8-8z" fill="#ff6b6b"/>
      <circle cx="104" cy="20" r="6" fill="#4cc9f0" stroke="#9aa7c7" stroke-width="2"/>
      <defs><linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#ffd166" stop-opacity="0"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs></svg>
    <svg class="fl comet" viewBox="0 0 220 40"><title>Comet</title>
      <defs><linearGradient id="tail" x1="0" x2="1"><stop offset="0" stop-color="#5ee6d0" stop-opacity="0"/><stop offset=".8" stop-color="#bff7ff" stop-opacity=".7"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
      <path d="M0 20L196 12a8 8 0 0 1 0 16z" fill="url(#tail)"/><circle cx="200" cy="20" r="9" fill="#fff"/><circle cx="200" cy="20" r="15" fill="#bff7ff" opacity=".35"/></svg>

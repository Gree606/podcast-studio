    <circle cx="60" cy="90" r="27" fill="#ef9f97"/>
    <path d="M38 76a27 27 0 0 0 30 40a27 27 0 0 1-30-40z" fill="#c9746e"/>
    <path d="M40 92h40" stroke="#d98680" stroke-width="3"/>
    <rect x="48" y="66" width="11" height="14" rx="5" fill="#f4f4f6"/><rect x="61" y="66" width="11" height="14" rx="5" fill="#f4f4f6"/>
    <rect x="47" y="45" width="26" height="24" rx="8" fill="#f4f4f6"/>
    <rect x="52" y="51" width="16" height="5" rx="2" fill="#7fb5b0"/>
    <circle cx="56" cy="62" r="4" fill="#e4e4ea"/><circle cx="64" cy="62" r="4" fill="#e4e4ea"/>
    <rect x="41" y="47" width="7" height="14" rx="3" fill="#e4e4ea"/><rect x="72" y="47" width="7" height="14" rx="3" fill="#e4e4ea"/>
    <circle cx="60" cy="32" r="16" fill="#f4f4f6"/>
    <ellipse cx="60" cy="33" rx="11" ry="10" fill="#1a1d26"/>
    <path d="M53 28a8 7 0 0 1 7-4" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M6 90A54 12 0 0 0 114 90" fill="none" stroke="#5f9e9a" stroke-width="7" transform="rotate(-8 60 90)"/>
  </symbol>
</svg>
    <svg class="fl ufo-s" viewBox="0 0 100 70"><title>Small saucer</title>
      <path class="ray" d="M38 46h24l14 24H24z" fill="#5ee6d0"/>

    <circle cx="90" cy="75" r="40" fill="#1a2550"/>
  </symbol>
<svg class="fl sat" viewBox="0 0 120 60"><title>Satellite</title>
      <g class="spin"><rect x="0" y="22" width="40" height="16" rx="2" fill="#3f6fd8"/><path d="M10 22v16M20 22v16M30 22v16" stroke="#9cc2ff" stroke-width="1.2"/>
      <rect x="80" y="22" width="40" height="16" rx="2" fill="#3f6fd8"/><path d="M90 22v16M100 22v16M110 22v16" stroke="#9cc2ff" stroke-width="1.2"/>

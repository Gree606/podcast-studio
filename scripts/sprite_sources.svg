<svg xmlns="http://www.w3.org/2000/svg">
<!-- Vector originals of the characters, ships and fleet. scripts/make_pixel_sprites.py turns them
     into the pixel sprites in frontend/sprites/. -->
<symbol id="av-host" viewBox="0 0 120 120">
    <title>Error606, the curious alien</title>
    <circle cx="60" cy="60" r="58" fill="var(--host-bg, #173a2c)"/>
    <g class="head">
      <g class="ant ant-l"><path d="M47 34l-7-12" stroke="#5fd38a" stroke-width="4" stroke-linecap="round"/><circle class="tip" cx="39" cy="20" r="6" fill="#ffd166"/></g>
      <g class="ant ant-r"><path d="M73 34l7-12" stroke="#5fd38a" stroke-width="4" stroke-linecap="round"/><circle class="tip t2" cx="81" cy="20" r="6" fill="#ff6b9d"/></g>
      <path d="M60 30c21 0 33 15 33 33 0 21-15 37-33 37S27 84 27 63c0-18 12-33 33-33z" fill="#7be495"/>
      <path d="M60 30c21 0 33 15 33 33 0 6-1 11-4 16 1-20-11-41-29-41-8 0-15 3-20 8 6-10 13-16 20-16z" fill="#9af0ae" opacity=".55"/>
      <circle cx="41" cy="47" r="3" fill="#5fc47c"/><circle cx="80" cy="44" r="2.4" fill="#5fc47c"/>
      <g class="eyes">
        <ellipse cx="46" cy="64" rx="10" ry="13" fill="#15122e" transform="rotate(-18 46 64)"/>
        <ellipse cx="74" cy="64" rx="10" ry="13" fill="#15122e" transform="rotate(18 74 64)"/>
        <g class="pupils"><circle cx="49" cy="58.5" r="3.4" fill="#fff"/><circle cx="77" cy="58.5" r="3.4" fill="#fff"/>
        <circle cx="44" cy="69" r="1.4" fill="#fff" opacity=".7"/><circle cx="72" cy="69" r="1.4" fill="#fff" opacity=".7"/></g>
      </g>
      <circle class="blush" cx="35" cy="81" r="4.5" fill="#ff8fb0"/><circle class="blush" cx="85" cy="81" r="4.5" fill="#ff8fb0"/>
      <path class="m-closed" d="M52 86q8 7 16 0" fill="none" stroke="#1d5c34" stroke-width="3" stroke-linecap="round"/>
      <ellipse class="m-open" cx="60" cy="88" rx="6.5" ry="5" fill="#1d5c34"/>
    </g>
  </symbol>
<symbol id="av-expert" viewBox="0 0 120 120">

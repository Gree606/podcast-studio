      <circle cx="60" cy="30" r="5" fill="#ffd166"/><path d="M60 18V6" stroke="#c9d2e6" stroke-width="2"/><circle class="lamp" cx="60" cy="5" r="3" fill="#ff6b9d"/></g><symbol id="logo" viewBox="0 0 120 120">

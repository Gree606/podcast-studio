      <path class="glint" d="M38 50a27 25 0 0 1 15-15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </symbol>
<symbol id="ship-ufo" viewBox="0 0 200 150">

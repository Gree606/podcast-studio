    <rect x="66" y="99" width="16" height="9" rx="2" fill="#ff6b6b"/><rect x="38" y="99" width="12" height="9" rx="2" fill="#4cc9f0"/>
    <g class="head">
      <path d="M86 29l9-14" stroke="#c9d2e6" stroke-width="3" stroke-linecap="round"/><circle class="tip" cx="95" cy="14" r="4" fill="#4cc9f0"/>
      <circle cx="60" cy="58" r="38" fill="#f4f6fb" stroke="#c9d2e6" stroke-width="3"/>
      <ellipse cx="60" cy="60" rx="28" ry="26" fill="#1a2550"/>
      <circle cx="60" cy="65" r="20" fill="#c98e63"/>
      <path d="M40 60c0-13 8-21 20-21s20 8 20 20c-5-5-9-8-11-11-7 5-17 9-29 12z" fill="#1d1d2b"/>
